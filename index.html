<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180711"><title>أنت قلبي وراحة روحي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,Tahoma,sans-serif;color:white;background:radial-gradient(ellipse at 50% 45%,#64162c 0%,#240a17 42%,#09070d 90%)}main{max-width:640px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;padding:20px 18px;text-align:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:50px}.toolbar button{background:#291522;border:1px solid #ae536d;color:#fff;padding:10px 12px;border-radius:12px;font-size:13px}.toolbar .danger{background:#9f2441}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center}.heart{font-size:105px;filter:drop-shadow(0 0 35px #ff406c);animation:pulse 2.5s infinite}@keyframes pulse{50%{transform:scale(1.07)}}h1{font-size:clamp(30px,8vw,52px);text-shadow:0 0 25px #ff4b79;line-height:1.5;margin:15px 0}.gift{font-size:76px;margin:15px}.info{background:#230f1d;border:1px solid #814056;border-radius:16px;padding:15px;line-height:1.8;color:#ffe4ed;max-width:480px}button{cursor:pointer}#start{background:#e33864;border:0;color:white;border-radius:15px;padding:15px 25px;font-size:17px;font-weight:700;margin:20px}.status{font-size:14px;color:#ffe4ed;padding:12px}video{width:min(100%,360px);max-height:220px;object-fit:cover;border-radius:16px;background:#100711;margin:12px auto}video.mirror{transform:scaleX(-1)}.hidden{display:none!important}.foot{font-size:12px;color:#dba7b8;line-height:1.6}</style></head><body><main><nav class="toolbar" id="toolbar" aria-label="Contrôles de partage"><button id="camera">Caméra inactive</button><button id="mic">Microphone inactif</button><button id="stop" class="danger">Arrêter le partage</button></nav><div class="hero"><div class="heart">❤️</div><h1>أنت قلبي وراحة روحي</h1><div class="gift">🎁</div><div id="consent" class="info">هذه هدية تفاعلية تحتوي على معاينة للكاميرا والميكروفون على جهازك فقط. عند الموافقة سيطلب المتصفح الإذن لتشغيلهما. <strong>لا يتم إرسال الصوت أو الصورة لأي شخص آخر.</strong></div><button id="start">أوافق على تشغيل الكاميرا والميكروفون</button><video id="preview" class="hidden mirror" autoplay muted playsinline></video><div class="status" role="status" aria-live="polite" id="status">الكاميرا والميكروفون متوقفان</div></div><footer class="foot">المعاينة محلية فقط وليست بثاً مباشراً. يمكنك إيقافها في أي وقت.</footer></main><script>let stream=null,front=true;const $=id=>document.getElementById(id);function update(){let v=stream?.getVideoTracks()[0],a=stream?.getAudioTracks()[0];$('camera').textContent=v?.enabled?'Caméra active — Arrêter':'Caméra inactive — Activer';$('mic').textContent=a?.enabled?'Microphone actif — Couper':'Microphone inactif — Activer'}function end(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('preview').classList.add('hidden');$('start').classList.remove('hidden');$('consent').classList.remove('hidden');$('status').textContent='الكاميرا والميكروفون متوقفان';update()}async function begin(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}},audio:true});$('preview').srcObject=stream;$('preview').classList.remove('hidden');$('start').classList.add('hidden');$('consent').classList.add('hidden');$('status').textContent='المعاينة المحلية تعمل — لا يوجد بث خارجي';update()}catch(e){$('status').textContent='تعذر الحصول على الإذن: '+e.message}}$('start').onclick=begin;$('stop').onclick=end;$('camera').onclick=()=>{if(!stream)return;const t=stream.getVideoTracks()[0];if(t)t.enabled=!t.enabled;update()};$('mic').onclick=()=>{if(!stream)return;const t=stream.getAudioTracks()[0];if(t)t.enabled=!t.enabled;update()};document.addEventListener('visibilitychange',()=>{if(document.hidden)end()});window.addEventListener('pagehide',end);update();</script></body></html>
