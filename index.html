<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هديتك 🎁 | معاينة خاصة</title><style>body{font-family:system-ui;background:#070e20;color:white;margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:480px;padding:30px;text-align:center;background:#101d35;border-radius:24px;margin:18px}h1{font-size:30px}button{background:#1678ff;color:white;border:0;border-radius:12px;padding:14px;margin:8px;font-size:17px}video{width:100%;border-radius:14px;background:black}p{line-height:1.8;color:#d5dfed}.stop{background:#bd253e}</style><main><h1>🎁 هديتك الخاصة</h1><p>معاينة خاصة للكاميرا والميكروفون على جهازك فقط. لا يُرسل هذا الموقع أي فيديو أو صوت إلى شخص آخر. يمكنك الإيقاف في أي وقت.</p><button id="start">أوافق وأبدأ المعاينة</button><button id="flip" hidden>تبديل الكاميرا</button><button id="stop" class="stop" hidden>إيقاف</button><video id="preview" autoplay muted playsinline></video><p id="status">الكاميرا والميكروفون متوقفان.</p></main><script>let stream,facing='user';const $=id=>document.getElementById(id);async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});$('preview').srcObject=stream;$('start').hidden=true;$('flip').hidden=false;$('stop').hidden=false;$('status').textContent='المعاينة تعمل على هذا الجهاز فقط، بدون بث خارجي.'}catch(e){$('status').textContent='تعذر التشغيل: '+e.message}}$('start').onclick=start;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};$('stop').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('preview').srcObject=null;$('start').hidden=false;$('flip').hidden=true;$('stop').hidden=true;$('status').textContent='تم الإيقاف.'};</script></html>
